<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 18px 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #f7c04e;
    }

    .hero-section {
      margin-top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-container {
      margin-bottom: 25px;
    }

    .profile-img {
      width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    #contact-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      width: 100%;
    }

    .buttons-group {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background-color: #f7c04e;
      color: #0b0f19;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: monospace, sans-serif;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #e5b042;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.02);
      color: #ffffff;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      font-size: 14px;
      font-family: monospace, sans-serif;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .social-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 5px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .status-text {
      font-size: 13px;
      color: #64748b;
      margin-top: 15px;
      font-family: monospace, sans-serif;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact-section" id="contact-link">Contact</a>
  </nav>

  <section class="hero-section" id="home">
    <div class="profile-container">
      <img src="your-photo.png" alt="Profile" class="profile-img">
    </div>
  </section>

  <section id="contact-section">
    <div class="buttons-group">
      <a href="#projects" class="btn-primary">View Projects &darr;</a>
      <a href="mailto:your-email@example.com" class="btn-secondary">Let's Connect &rarr;</a>
    </div>

    <div class="social-group">
      <a href="https://github.com" target="_blank" class="social-btn" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://linkedin.com" target="_blank" class="social-btn" title="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>
      <a href="mailto:your-email@example.com" class="social-btn" title="Email">
        <i class="fa-regular fa-envelope"></i>
      </a>
    </div>

    <p class="status-text">Based in Riyadh | Available for full-time work</p>
  </section>

  <script>
    document.getElementById('contact-link').addEventListener('click', function(e) {
      e.preventDefault();
      const target = document.getElementById('contact-section');
      target.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    });
  </script>

</body>
</html>
